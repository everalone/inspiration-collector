name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify regressions
        run: |
          npm run typecheck
          npm test

      - name: Build Windows packages
        run: |
          npm run build:core
          npx electron-builder --win --publish never

      - name: Check package privacy boundary
        run: node scripts/check-package.mjs release/win-unpacked/resources/app.asar

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          & './release/win-unpacked/灵感收集.exe' scripts/check-runtime.mjs release/win-unpacked/resources/app.asar
          exit $LASTEXITCODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/InspirationCollector-Setup-*.exe
            release/InspirationCollector-Portable-*.exe
            release/latest.yml
          body_path: docs/releases/${{ github.ref_name }}.md
