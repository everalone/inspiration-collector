<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵感收集</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand-row"><h1>灵感收集</h1></div>
  <div class="ingest-bar">
    <input id="ingest-input" type="text" placeholder="粘贴微信公众号文章链接，自动整理入库…">
    <button id="ingest-btn">收集</button>
  </div>
  <input id="search" type="search" placeholder="搜索标题 / 内容 / 公众号…">
  <nav id="tabs"></nav>
</header>

<main class="layout">
  <aside id="list"></aside>
  <div id="splitter" title="拖动调整宽度"></div>
  <section id="detail"><div class="empty">选择左侧卡片查看详情</div></section>
</main>

<div id="toast" class="toast hidden"></div>
<div id="lightbox" class="lightbox hidden">
  <img id="lightbox-img" src="" alt="来源原图">
</div>
<div id="modal" class="modal-mask hidden"></div>

<script src="app.js"></script>
</body>
</html>
